
---
apiVersion: v1
kind: PersistentVolume
metadata:
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: github-cotalk
    meta.helm.sh/release-namespace: default
    helm.sh/resource-policy: keep
    pv.kubernetes.io/provisioned-by: cephfs.csi.ceph.com
    volume.kubernetes.io/provisioner-deletion-secret-name: csi-cephfs-secret
    volume.kubernetes.io/provisioner-deletion-secret-namespace: cephfs-sc
  name: pv-gotalk-db
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 20Gi
  csi:
    controllerExpandSecretRef:
      name: csi-cephfs-secret
      namespace: cephfs-sc
    driver: cephfs.csi.ceph.com
    nodeStageSecretRef:
      name: csi-cephfs-secret
      namespace: cephfs-sc
    volumeAttributes:
      clusterID: 630e582f-2277-4a8b-a902-8ac08536cd62
      fsName: cephfs-userdata-nvme
      mounter: kernel
      staticVolume: "true"
      rootPath: /_k8s-storage/volumes-hostPath/gotalk/dbpost-data/
    volumeHandle: pv-gotalk-db-static-v1
  persistentVolumeReclaimPolicy: Retain
  storageClassName: csi-cephfs-sc-system-kernel-delete
  volumeMode: Filesystem


---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: github-cotalk
    meta.helm.sh/release-namespace: default
    helm.sh/resource-policy: keep
    volume.beta.kubernetes.io/storage-provisioner: cephfs.csi.ceph.com
    volume.kubernetes.io/storage-provisioner: cephfs.csi.ceph.com

  name: pvc-gotalk-db
  namespace: myapps
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: csi-cephfs-sc-system-kernel-delete
  volumeMode: Filesystem
  volumeName: pv-gotalk-db

